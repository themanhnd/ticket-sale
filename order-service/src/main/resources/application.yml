spring:
  application:
    # Tên dùng để Config Server tìm order-service-{profile}.yml.
    name: order-service
  config:
    # Local lấy cấu hình từ Config Server; Docker sẽ ghi đè URL bằng biến môi trường.
    import: optional:configserver:http://localhost:8888

server:
  port: 8094

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus