services:
  redis:
    #    Dùng biến môi truường REDIS_VERSION , nếu không có thì mặc định là 7.2-alpine
    image: redis:${REDIS_VERSION:-7.2-alpine}
    container_name: ticket-redis
    profiles: ["infra", "platform"]
    #    máy bạn mở port 6379, trỏ vào port 6379 trong container.
    ports:
      - "${REDIS_PORT:-6379}:6379"

  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: ticket-mysql
    profiles: ["infra", "platform"]
    environment:
      #      Nó tạo sẵn database user_service_db, password root mặc định là root
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-user_service_db}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    #   giữ data MySQL lại, không mất khi restart container.
    volumes:
      - ticket-mysql-data:/var/lib/mysql
    #    kiểm tra MySQL đã sẵn sàng chưa.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  #    Đây thường là Eureka Server trong Spring Cloud, nơi các service đăng ký địa chỉ của mình.
  discovery:
    #    Không dùng image có sẵn, mà build từ thư mục ./discovery.
    build:
      context: ./discovery
      dockerfile: Dockerfile
    container_name: ticket-discovery
    profiles: ["platform"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "${DISCOVERY_PORT:-8761}:8761"
  #  Đây thường là Spring Cloud Config Server.
  config:
    build:
      context: ./config
      dockerfile: Dockerfile
    #      Docker tự khởi động lại container nếu nó bị tắt bất ngờ, trừ khi bạn tự tay stop nó. hay dùng cho database, app backend, nginx, redis.
    restart: unless-stopped
    container_name: ticket-config
    profiles: ["platform"]
    environment:
      SPRING_PROFILES_ACTIVE: native,docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:-http://discovery:8761/eureka/}
    ports:
      - "${CONFIG_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      #      - :ro nghĩa là read-only.
      #      - đọc config từ:
      - ./environment/config-repo:/app/config-repo:ro
    #      Nó phụ thuộc vào discovery:
    depends_on:
      - discovery

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: ticket-user-service
    profiles: ["platform"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_IMPORT:-configserver:http://config:8888}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:-http://discovery:8761/eureka/}
    ports:
      - "${USER_SERVICE_PORT:-8091}:8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    #      Phải đợi MySQL khỏe và Config Server khỏe rồi mới chạy.
    depends_on:
      mysql:
        condition: service_healthy
      discovery:
        condition: service_started
      config:
        condition: service_healthy
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: ticket-gateway
    profiles: ["platform"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_IMPORT:-configserver:http://config:8888}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:-http://discovery:8761/eureka/}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    #      Nó cần Redis, Discovery, Config, User Service.
    depends_on:
      redis:
        condition: service_started
      discovery:
        condition: service_started
      config:
        condition: service_healthy
      user-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
  event-service:
    build:
      context: ./event-service
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: ticket-event-service
    profiles: [ "platform" ]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_IMPORT:-configserver:http://config:8888}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:-http://discovery:8761/eureka/}
    ports:
      - "8092:8092"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8092/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      mysql:
        condition: service_healthy
      discovery:
        condition: service_started
      config:
        condition: service_healthy
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: ticket-inventory-service
    profiles: [ "platform" ]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_IMPORT:-configserver:http://config:8888}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:-http://discovery:8761/eureka/}
    ports:
      - "8093:8093"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8093/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      mysql:
        condition: service_healthy
      discovery:
        condition: service_started
      config:
        condition: service_healthy
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: ticket-order-service
    profiles: [ "platform" ]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_IMPORT:-configserver:http://config:8888}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:-http://discovery:8761/eureka/}
    ports:
      - "8094:8094"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8094/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      mysql:
        condition: service_healthy
      discovery:
        condition: service_started
      config:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
volumes:
 ticket-mysql-data: