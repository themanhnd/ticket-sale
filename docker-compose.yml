services:
  redis:
    image: redis:${REDIS_VERSION:-7.2-alpine}
    container_name: ticket-redis
    profiles: ["infra", "platform"]
    ports:
      - "${REDIS_PORT:-6379}:6379"

  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: ticket-mysql
    profiles: ["infra", "platform"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-user_service_db}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ticket-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery:
    build:
      context: ./discovery
      dockerfile: Dockerfile
    container_name: ticket-discovery
    profiles: ["platform"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "${DISCOVERY_PORT:-8761}:8761"

  config:
    build:
      context: ./config
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: ticket-config
    profiles: ["platform"]
    environment:
      SPRING_PROFILES_ACTIVE: native,docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:-http://discovery:8761/eureka/}
    ports:
      - "${CONFIG_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ./environment/config-repo:/app/config-repo:ro
    depends_on:
      - discovery

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: ticket-user-service
    profiles: ["platform"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_IMPORT:-configserver:http://config:8888}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:-http://discovery:8761/eureka/}
    ports:
      - "${USER_SERVICE_PORT:-8091}:8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      mysql:
        condition: service_healthy
      discovery:
        condition: service_started
      config:
        condition: service_healthy
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: ticket-gateway
    profiles: ["platform"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_IMPORT:-configserver:http://config:8888}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:-http://discovery:8761/eureka/}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      redis:
        condition: service_started
      discovery:
        condition: service_started
      config:
        condition: service_healthy
      user-service:
        condition: service_healthy

volumes:
  ticket-mysql-data:
